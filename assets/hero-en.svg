<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b1a"/><stop offset=".55" stop-color="#120a2a"/><stop offset="1" stop-color="#04131c"/></linearGradient>
  <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#a78bfa"><animate attributeName="stop-color" values="#a78bfa;#22d3ee;#f472b6;#a78bfa" dur="7s" repeatCount="indefinite"/></stop>
    <stop offset=".5" stop-color="#22d3ee"><animate attributeName="stop-color" values="#22d3ee;#f472b6;#a78bfa;#22d3ee" dur="7s" repeatCount="indefinite"/></stop>
    <stop offset="1" stop-color="#f472b6"><animate attributeName="stop-color" values="#f472b6;#a78bfa;#22d3ee;#f472b6" dur="7s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#7c3aed" stop-opacity=".55"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
</defs>
<style>
  .flow{stroke-width:1.4;stroke-dasharray:6 10;opacity:.45;animation:flow 2.2s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-64}}
  .node{animation:float 4s ease-in-out infinite alternate}
  @keyframes float{from{transform:translateY(-4px)}to{transform:translateY(4px)}}
  .ring{stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ring 2.6s ease-out infinite}
  @keyframes ring{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.2);opacity:0}}
  .lbl{font:600 13px 'Segoe UI', Inter, Helvetica, Arial, sans-serif;fill:#cbd5e1;letter-spacing:.5px}
  .orb{transform-box:fill-box;transform-origin:center;animation:pulse 3.5s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.15);opacity:.75}}
  .title{font:900 92px 'Segoe UI', Inter, Helvetica, Arial, sans-serif;letter-spacing:-2px}
  .sub{font:500 21px 'Segoe UI', Inter, Helvetica, Arial, sans-serif;fill:#e2e8f0;opacity:0;animation:in 1.2s .4s ease forwards}
  .tag{font:700 13px 'Segoe UI', Inter, Helvetica, Arial, sans-serif;fill:#94a3b8;letter-spacing:4px;opacity:0;animation:in 1.2s .9s ease forwards}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
<rect width="1200" height="380" rx="24" fill="url(#bg)"/>
<line x1="600" y1="40" x2="600" y2="190" stroke="#a78bfa" class="flow" style="animation-delay:0.00s"/>
<line x1="835" y1="60" x2="600" y2="190" stroke="#f472b6" class="flow" style="animation-delay:0.35s"/>
<line x1="1007" y1="115" x2="600" y2="190" stroke="#e879f9" class="flow" style="animation-delay:0.70s"/>
<line x1="1070" y1="190" x2="600" y2="190" stroke="#34d399" class="flow" style="animation-delay:1.05s"/>
<line x1="1007" y1="265" x2="600" y2="190" stroke="#60a5fa" class="flow" style="animation-delay:1.40s"/>
<line x1="835" y1="320" x2="600" y2="190" stroke="#fb923c" class="flow" style="animation-delay:1.75s"/>
<line x1="600" y1="340" x2="600" y2="190" stroke="#facc15" class="flow" style="animation-delay:2.10s"/>
<line x1="365" y1="320" x2="600" y2="190" stroke="#4ade80" class="flow" style="animation-delay:2.45s"/>
<line x1="193" y1="265" x2="600" y2="190" stroke="#22d3ee" class="flow" style="animation-delay:2.80s"/>
<line x1="130" y1="190" x2="600" y2="190" stroke="#a78bfa" class="flow" style="animation-delay:3.15s"/>
<line x1="193" y1="115" x2="600" y2="190" stroke="#f472b6" class="flow" style="animation-delay:3.50s"/>
<line x1="365" y1="60" x2="600" y2="190" stroke="#e879f9" class="flow" style="animation-delay:3.85s"/>
<ellipse cx="600" cy="190" rx="330" ry="150" fill="url(#glow)" class="orb"/>
<g class="node" style="animation-delay:0.00s"><circle cx="600" cy="40" r="7" fill="#a78bfa"/><circle cx="600" cy="40" r="7" fill="none" stroke="#a78bfa" class="ring" style="animation-delay:0.00s"/><text x="600" y="26" text-anchor="middle" class="lbl">skills</text></g>
<g class="node" style="animation-delay:0.35s"><circle cx="835" cy="60" r="7" fill="#f472b6"/><circle cx="835" cy="60" r="7" fill="none" stroke="#f472b6" class="ring" style="animation-delay:0.35s"/><text x="835" y="46" text-anchor="middle" class="lbl">MCPs</text></g>
<g class="node" style="animation-delay:0.70s"><circle cx="1007" cy="115" r="7" fill="#e879f9"/><circle cx="1007" cy="115" r="7" fill="none" stroke="#e879f9" class="ring" style="animation-delay:0.70s"/><text x="1007" y="101" text-anchor="middle" class="lbl">plugins</text></g>
<g class="node" style="animation-delay:1.05s"><circle cx="1070" cy="190" r="7" fill="#34d399"/><circle cx="1070" cy="190" r="7" fill="none" stroke="#34d399" class="ring" style="animation-delay:1.05s"/><text x="1070" y="176" text-anchor="middle" class="lbl">CLI</text></g>
<g class="node" style="animation-delay:1.40s"><circle cx="1007" cy="265" r="7" fill="#60a5fa"/><circle cx="1007" cy="265" r="7" fill="none" stroke="#60a5fa" class="ring" style="animation-delay:1.40s"/><text x="1007" y="289" text-anchor="middle" class="lbl">agents</text></g>
<g class="node" style="animation-delay:1.75s"><circle cx="835" cy="320" r="7" fill="#fb923c"/><circle cx="835" cy="320" r="7" fill="none" stroke="#fb923c" class="ring" style="animation-delay:1.75s"/><text x="835" y="344" text-anchor="middle" class="lbl">tips</text></g>
<g class="node" style="animation-delay:2.10s"><circle cx="600" cy="340" r="7" fill="#facc15"/><circle cx="600" cy="340" r="7" fill="none" stroke="#facc15" class="ring" style="animation-delay:2.10s"/><text x="600" y="364" text-anchor="middle" class="lbl">design</text></g>
<g class="node" style="animation-delay:2.45s"><circle cx="365" cy="320" r="7" fill="#4ade80"/><circle cx="365" cy="320" r="7" fill="none" stroke="#4ade80" class="ring" style="animation-delay:2.45s"/><text x="365" y="344" text-anchor="middle" class="lbl">video</text></g>
<g class="node" style="animation-delay:2.80s"><circle cx="193" cy="265" r="7" fill="#22d3ee"/><circle cx="193" cy="265" r="7" fill="none" stroke="#22d3ee" class="ring" style="animation-delay:2.80s"/><text x="193" y="289" text-anchor="middle" class="lbl">QA</text></g>
<g class="node" style="animation-delay:3.15s"><circle cx="130" cy="190" r="7" fill="#a78bfa"/><circle cx="130" cy="190" r="7" fill="none" stroke="#a78bfa" class="ring" style="animation-delay:3.15s"/><text x="130" y="214" text-anchor="middle" class="lbl">mobile</text></g>
<g class="node" style="animation-delay:3.50s"><circle cx="193" cy="115" r="7" fill="#f472b6"/><circle cx="193" cy="115" r="7" fill="none" stroke="#f472b6" class="ring" style="animation-delay:3.50s"/><text x="193" y="101" text-anchor="middle" class="lbl">games</text></g>
<g class="node" style="animation-delay:3.85s"><circle cx="365" cy="60" r="7" fill="#e879f9"/><circle cx="365" cy="60" r="7" fill="none" stroke="#e879f9" class="ring" style="animation-delay:3.85s"/><text x="365" y="46" text-anchor="middle" class="lbl">audio</text></g>
<text x="600" y="200" text-anchor="middle" class="title" fill="url(#txt)">AllForOne</text>
<text x="600" y="240" text-anchor="middle" class="sub">Everything worth using with Claude Code, in one place</text>
<text x="600" y="272" text-anchor="middle" class="tag">SKILLS · PLUGINS · MCPs · TOOLS · TIPS</text>
</svg>
