<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150">
<style>
  .card{opacity:0;animation:up .9s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  .shine{stroke-dasharray:120 900;animation:shine 3.5s linear infinite}
  @keyframes shine{to{stroke-dashoffset:-1020}}
  .num{font:900 46px 'Segoe UI', Inter, Helvetica, Arial, sans-serif}
  .lbl{font:600 15px 'Segoe UI', Inter, Helvetica, Arial, sans-serif;fill:#94a3b8;letter-spacing:2px;text-transform:uppercase}
</style>
<g class="card" style="animation-delay:0.15s">
  <rect x="24" y="18" width="270" height="114" rx="18" fill="#0f172a" stroke="#a78bfa" stroke-opacity=".55"/>
  <rect x="24" y="18" width="270" height="114" rx="18" fill="none" stroke="#a78bfa" stroke-width="2" class="shine" style="animation-delay:0.75s"/>
  <text x="159" y="82" text-anchor="middle" class="num" fill="#a78bfa">96</text>
  <text x="159" y="112" text-anchor="middle" class="lbl">repos</text>
</g>
<g class="card" style="animation-delay:0.33s">
  <rect x="318" y="18" width="270" height="114" rx="18" fill="#0f172a" stroke="#22d3ee" stroke-opacity=".55"/>
  <rect x="318" y="18" width="270" height="114" rx="18" fill="none" stroke="#22d3ee" stroke-width="2" class="shine" style="animation-delay:0.93s"/>
  <text x="453" y="82" text-anchor="middle" class="num" fill="#22d3ee">12</text>
  <text x="453" y="112" text-anchor="middle" class="lbl">áreas</text>
</g>
<g class="card" style="animation-delay:0.51s">
  <rect x="612" y="18" width="270" height="114" rx="18" fill="#0f172a" stroke="#f472b6" stroke-opacity=".55"/>
  <rect x="612" y="18" width="270" height="114" rx="18" fill="none" stroke="#f472b6" stroke-width="2" class="shine" style="animation-delay:1.11s"/>
  <text x="747" y="82" text-anchor="middle" class="num" fill="#f472b6">40</text>
  <text x="747" y="112" text-anchor="middle" class="lbl">tips</text>
</g>
<g class="card" style="animation-delay:0.69s">
  <rect x="906" y="18" width="270" height="114" rx="18" fill="#0f172a" stroke="#34d399" stroke-opacity=".55"/>
  <rect x="906" y="18" width="270" height="114" rx="18" fill="none" stroke="#34d399" stroke-width="2" class="shine" style="animation-delay:1.29s"/>
  <text x="1041" y="82" text-anchor="middle" class="num" fill="#34d399">62</text>
  <text x="1041" y="112" text-anchor="middle" class="lbl">fuentes</text>
</g>
</svg>
